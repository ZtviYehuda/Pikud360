<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>אין חיבור לרשת — פיקוד 360</title>
  <link rel="icon" type="image/png" href="/logo_unit.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <script>
    (function() {
      try {
        const theme = localStorage.getItem('theme');
        if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    })();
  </script>

  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #0f172a;
      --primary-hover: #1e293b;
      --primary-text: #ffffff;
      --badge-bg: #f1f5f9;
      --badge-border: #e2e8f0;
      --badge-text: #475569;
      --icon-bg: #fef2f2;
      --icon-color: #ef4444;
      --icon-border: #fee2e2;
    }

    html.dark {
      --bg: #09090b;
      --card-bg: #18181b;
      --card-border: #27272a;
      --text-main: #fafafa;
      --text-muted: #a1a1aa;
      --primary: #fafafa;
      --primary-hover: #e4e4e7;
      --primary-text: #09090b;
      --badge-bg: #27272a;
      --badge-border: #3f3f46;
      --badge-text: #d4d4d8;
      --icon-bg: #450a0a;
      --icon-color: #f87171;
      --icon-border: #7f1d1d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: var(--bg);
      color: var(--text-main);
      font-family: 'Assistant', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 1.5rem;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .card {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 1rem;
      padding: 2.25rem 2rem;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px -1px rgba(0, 0, 0, 0.05);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      background: var(--badge-bg);
      border: 1px solid var(--badge-border);
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--badge-text);
      margin-bottom: 1.5rem;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #ef4444;
    }

    .icon-container {
      width: 48px;
      height: 48px;
      border-radius: 0.75rem;
      background-color: var(--icon-bg);
      border: 1px solid var(--icon-border);
      color: var(--icon-color);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.25rem;
    }

    .icon-container svg {
      width: 24px;
      height: 24px;
      stroke-width: 2;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 0.5rem;
      letter-spacing: -0.01em;
    }

    p {
      font-size: 0.875rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 1.75rem;
      max-width: 360px;
    }

    .btn-retry {
      width: 100%;
      height: 2.5rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background-color: var(--primary);
      color: var(--primary-text);
      border: none;
      border-radius: 0.625rem;
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s ease, transform 0.05s ease;
      text-decoration: none;
    }

    .btn-retry:hover {
      opacity: 0.9;
    }

    .btn-retry:active {
      transform: scale(0.99);
    }

    .btn-retry svg {
      width: 16px;
      height: 16px;
      stroke-width: 2;
    }

    .status-check {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 1.25rem;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .spinner {
      width: 12px;
      height: 12px;
      border: 2px solid var(--card-border);
      border-top-color: var(--text-muted);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .footer-text {
      margin-top: 1.75rem;
      font-size: 0.75rem;
      color: var(--text-muted);
      opacity: 0.6;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="status-badge">
      <span class="status-dot"></span>
      <span>מערכת מנותקת</span>
    </div>

    <div class="icon-container">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>

    <h1>אין חיבור לרשת</h1>
    <p>
      לא ניתן ליצור קשר עם שרתי המערכת. אנא ודא שחיבור האינטרנט פעיל או המתן לחידוש החיבור.
    </p>

    <button class="btn-retry" id="retry-btn" onclick="handleRetry()">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99" />
      </svg>
      נסה להתחבר מחדש
    </button>

    <div class="status-check">
      <div class="spinner"></div>
      <span id="status-text">בדיקת חיבור אוטומטית פעילה...</span>
    </div>

    <div class="footer-text">
      פיקוד 360 · מערכת ניהול כוח אדם
    </div>
  </div>

  <script>
    function handleRetry() {
      const btn = document.getElementById('retry-btn');
      const text = document.getElementById('status-text');
      if (btn) btn.style.opacity = '0.7';
      if (text) text.innerText = 'בודק חיבור לשרת...';
      
      fetch('/api/security/health', { method: 'GET', cache: 'no-cache' })
        .then(function() {
          window.location.reload();
        })
        .catch(function() {
          setTimeout(function() {
            window.location.reload();
          }, 400);
        });
    }

    window.addEventListener('online', function() {
      const text = document.getElementById('status-text');
      if (text) text.innerText = 'החיבור חזר! מרענן דף...';
      setTimeout(function() {
        window.location.reload();
      }, 400);
    });

    setInterval(function() {
      if (navigator.onLine) {
        fetch('/', { method: 'HEAD', cache: 'no-cache' })
          .then(function() {
            window.location.reload();
          })
          .catch(function() {});
      }
    }, 4000);
  </script>
</body>
</html>

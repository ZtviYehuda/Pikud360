<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>אין חיבור לרשת - Unit</title>
  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=Outfit:wght@500;700;900&display=swap" rel="stylesheet">
  <script>
    (function() {
      try {
        // Theme synchronization
        const theme = localStorage.getItem('theme');
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else if (theme === 'light') {
          document.documentElement.classList.remove('dark');
        } else {
          // Fallback to system OS preferences
          if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
          }
        }

        // Accent color synchronization
        const accent = localStorage.getItem('accentColor');
        if (accent) {
          const root = document.documentElement;
          if (accent.startsWith('#')) {
            root.style.setProperty('--primary', accent);
            
            // Hex to RGB for glow effect
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(accent);
            if (result) {
              const rgb = `${parseInt(result[1], 16)}, ${parseInt(result[2], 16)}, ${parseInt(result[3], 16)}`;
              root.style.setProperty('--accent-glow', `rgba(${rgb}, 0.15)`);
            }
          } else if (accent === 'emerald') {
            root.style.setProperty('--primary', '#10b981');
            root.style.setProperty('--accent-glow', 'rgba(16, 185, 129, 0.15)');
          } else if (accent === 'blue') {
            root.style.setProperty('--primary', '#3b82f6');
            root.style.setProperty('--accent-glow', 'rgba(59, 130, 246, 0.15)');
          }
        }
      } catch (e) {
        console.error(e);
      }
    })();
  </script>

  <style>
    :root {
      /* Default: Light Mode */
      --bg-color: #f8fafc;
      --text-primary: #0f172a;
      --text-secondary: #64748b;
      --primary: #3b82f6;
      --accent: var(--primary);
      --accent-hover: #2563eb;
      --accent-glow: rgba(59, 130, 246, 0.15);
    }

    html.dark {
      --bg-color: #090d16;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent-glow: rgba(59, 130, 246, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: var(--bg-color);
      color: var(--text-primary);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      text-align: center;
      overflow: hidden;
      padding: 1.5rem;
      position: relative;
      transition: background-color 0.3s ease;
    }

    /* Ambient glow */
    .ambient-glow {
      position: absolute;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, transparent 70%);
      filter: blur(40px);
      pointer-events: none;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -60%);
    }

    /* Outer Wrapper */
    .content-wrapper {
      position: relative;
      z-index: 10;
      max-width: 440px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .emblem-container {
      position: relative;
      width: 110px;
      height: 110px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 2rem;
    }

    .emblem-img {
      width: 90px;
      height: 90px;
      object-fit: contain;
      filter: drop-shadow(0 8px 24px rgba(59, 130, 246, 0.3));
      position: relative;
      z-index: 5;
    }

    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 2rem;
      font-weight: 900;
      margin-bottom: 0.75rem;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--text-primary) 60%, var(--text-secondary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      color: var(--text-secondary);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 2.5rem;
      max-width: 340px;
    }

    .btn-reconnect {
      position: relative;
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 0.9rem 2.2rem;
      font-size: 0.95rem;
      font-weight: 700;
      border-radius: 1.25rem;
      cursor: pointer;
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 20px var(--accent-glow);
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .btn-reconnect:hover {
      background-color: var(--accent-hover);
      box-shadow: 0 8px 30px rgba(37, 99, 235, 0.5);
      transform: translateY(-2px);
    }

    .btn-reconnect:active {
      transform: translateY(1px);
    }

    .btn-reconnect svg {
      width: 18px;
      height: 18px;
      transition: transform 0.6s ease;
    }

    .btn-reconnect:hover svg {
      transform: rotate(360deg);
    }
  </style>
</head>
<body>
  <div class="ambient-glow"></div>
  
  <div class="content-wrapper">
    <!-- Clean Emblem without spinning light artifacts -->
    <div class="emblem-container">
      <img src="/matzevet_icon.png" alt="Unit" class="emblem-img">
    </div>

    <!-- Title and Description -->
    <h1>חיבור הרשת אבד</h1>
    <p>המערכת לא הצליחה להתחבר לשרת. אנא ודא שאתה מחובר לרשת אלחוטית או סלולרית תקינה ונסה שוב.</p>

    <!-- Reconnect Button -->
    <button class="btn-reconnect" onclick="window.location.reload()">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99" />
      </svg>
      נסה להתחבר מחדש
    </button>
  </div>
</body>
</html>
